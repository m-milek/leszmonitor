root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -gcflags=\"all=-N -l\" -o ./tmp/main ."
  bin = "tmp/main"
  full_bin = "$(go env GOPATH)/bin/dlv exec --accept-multiclient --continue --headless --listen=:2345 --api-version=2 ./tmp/main --"
  include_ext = ["go"]
  exclude_dir = ["tmp", "static"]
  stop_on_error = true
  send_interrupt = true
  kill_delay = "2s"

[log]
  time = false
