name: Build and Test
on:
  push:
    branches:
      - main
  pull_request:
    types: [ opened, synchronize, reopened ]

jobs:
  leszmonitor-server:
    name: Server
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.1'
          cache: true
          cache-dependency-path: leszmonitor-server/src/go.sum

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x

      - name: Mock web assets
        run: |
          mkdir -p leszmonitor-server/src/static &&
          touch leszmonitor-server/src/static/index.html

      - name: Build Server
        run: task server:build

      - name: Test Server
        run: task server:coverage

      - name: Upload Go Coverage Report
        uses: actions/upload-artifact@v6
        with:
          name: go-coverage-report
          path: leszmonitor-server/src/coverage.out
          retention-days: 1

  leszmonitor-web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./leszmonitor-web

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: 'npm'
          cache-dependency-path: './leszmonitor-web/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run web tests
        run: npm run test:coverage

      - name: Upload TS Coverage Report
        uses: actions/upload-artifact@v6
        with:
          name: ts-coverage-report
          path: leszmonitor-web/coverage
          retention-days: 1

      - name: Build application
        run: npm run build

  sonar:
    name: SonarQube
    runs-on: ubuntu-latest
    needs: [ leszmonitor-server, leszmonitor-web ]
    continue-on-error: true

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download Go Coverage Report
        uses: actions/download-artifact@v6
        with:
          name: go-coverage-report
          path: leszmonitor-server/src

      - name: Download TS Coverage Report
        uses: actions/download-artifact@v6
        with:
          name: ts-coverage-report
          path: leszmonitor-web/coverage

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Exit with status 0 to prevent failure
        if: always()
        run: exit 0

  e2e:
    name: Docker Build & E2E Tests
    runs-on: ubuntu-latest
    needs: [ leszmonitor-server, leszmonitor-web ]
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install Task
        uses: arduino/setup-task@v2

      - name: Build the app image
        env:
          CI_BUILD_NUMBER: ${{ github.run_number }}
          GIT_COMMIT: ${{ github.sha }}
          IMAGE_TAG: dev
          VERSION: ${{ github.sha }}-SNAPSHOT
        run: task docker:build

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: 'npm'
          cache-dependency-path: './leszmonitor-web/package-lock.json'

      - name: Initialize DB
        run: touch server/src/leszmonitor.db

      - name: Restore DB from dump
        run: task server:db:restore

      - name: Run end-to-end tests
        run: task web:test:e2e