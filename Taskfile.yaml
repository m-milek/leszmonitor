version: '3'

includes:
  server:
    taskfile: ./leszmonitor-server
    dir: ./leszmonitor-server
  frontend:
    taskfile: ./frontend
    dir: ./frontend

tasks:
  docker:build:
    desc: Build both frontend and server Docker images
    cmd: |
      docker build \
      --build-arg CI_BUILD_NUMBER=$CI_BUILD_NUMBER \
      --build-arg GIT_COMMIT=$GIT_COMMIT \
      --build-arg IMAGE_TAG=$IMAGE_TAG \
      --build-arg VERSION=$VERSION \
      -t leszmonitor .

  docker:up:
    desc: Start all services using Docker Compose
    cmds:
      - docker compose up

  docker:up:no-build:
    desc: Start without rebuilding
    cmds:
      - docker compose up --no-build

  docker:down:
    desc: Stop all services using Docker Compose
    cmds:
      - docker compose down

  dev:
    desc: Run both frontend and server in development mode
    deps: [ server:dev, frontend:dev ]

  build:
    desc: Build both frontend and server
    cmds:
      - task: frontend:build
      - task: server:build

  test:
    desc: Run tests for both frontend and server
    deps: [ server:test, frontend:test ]

  clean:
    desc: Clean all build artifacts
    deps: [ frontend:clean, server:clean, logs:clean ]
