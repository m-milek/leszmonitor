version: '3'

includes:
  server:
    taskfile: ./leszmonitor-server
    dir: ./leszmonitor-server
  web:
    taskfile: ./leszmonitor-web
    dir: ./leszmonitor-web

tasks:
  docker:build:
    desc: Build both web and server Docker images
    cmd: |
      docker build \
      --build-arg CI_BUILD_NUMBER=$CI_BUILD_NUMBER \
      --build-arg GIT_COMMIT=$GIT_COMMIT \
      --build-arg IMAGE_TAG=$IMAGE_TAG \
      --build-arg VERSION=$VERSION \
      -t leszmonitor .

  docker:up:
    desc: Start all services using Docker Compose
    cmds:
      - docker compose up

  docker:up:no-build:
    desc: Start without rebuilding
    cmds:
      - docker compose up --no-build

  docker:down:
    desc: Stop all services using Docker Compose
    cmds:
      - docker compose down

  dev:
    desc: Run both web and server in development mode
    deps: [ server:dev, web:dev ]

  build:
    desc: Build both web and server
    cmds:
      - task: web:build
      - task: server:build

  test:
    desc: Run tests for both web and server
    deps: [ server:test, web:test ]

  clean:
    desc: Clean all build artifacts
    deps: [ web:clean, server:clean ]
